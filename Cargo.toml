[package]
name = "claudehud"
version = "0.1.5"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = "0.26.1"
ureq = "3.5.0"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_Debug", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_UI_Shell"] }
